name: goal_iteration
description: >-
  One iteration of goal_loop: check the deadline, let codex propose an idea and claude-code make one small
  documented commit toward the goal (up to three turns on the same idea, until
  it ends a turn with a real COMMIT line), verify the commit mechanically, let
  codex judge it (up to two turns, until a real VERDICT line), then keep it or
  reset the worktree to base. Before the agents run, the remaining Claude
  (Fable weekly, 5-hour) and Codex weekly allowances are read; a meter below
  its floor or an unreadable meter makes the pass wait usage_poll_seconds
  instead so goal_loop rechecks on its next pass. Everything under .atelier/
  (idea documents, logs) is always preserved. Any unexpected state fails the
  flow and leaves the worktree as it is for manual review.
inputs:
  goal: What the codebase should move toward. Used only inside agent prompts.
  deadline: Unix epoch seconds generated by goal_loop setup (digits only).
  min_claude_fable_remaining: {description: "Pause while the remaining Claude Fable weekly allowance is below this percent (1-100); exactly this much remaining still runs. Trusted operator input, interpolated into shell.", default: "50"}
  min_claude_5h_remaining: {description: "Pause while the remaining Claude 5-hour allowance is below this percent (1-100); exactly this much remaining still runs. Trusted operator input, interpolated into shell.", default: "50"}
  min_codex_remaining: {description: "Pause while the remaining Codex weekly allowance is below this percent (1-100); exactly this much remaining still runs. Trusted operator input, interpolated into shell.", default: "30"}
  usage_poll_seconds: {description: "Seconds to wait before rechecking usage while paused (1-3600). Trusted operator input, interpolated into shell.", default: "300"}
tasks:
  - deadline:
      description: Print ATELIER_DEADLINE once the deadline has passed, otherwise CONTINUE
      task: |
        set -euo pipefail
        deadline='{{inputs.deadline}}'
        [[ $deadline =~ ^[0-9]{1,12}$ ]] || { echo "goal_iteration: deadline must be epoch digits, got '$deadline'" >&2; exit 1; }
        if [ "$(date +%s)" -ge "$deadline" ]; then echo ATELIER_DEADLINE; else echo CONTINUE; fi
      tool: tool:bash
      depends_on: []
  - usage:
      description: Read usage once (scripts/usage.py) and print it; USAGE_READY runs a pass, USAGE_PAUSE waits, and ATELIER_DEADLINE if the reads outlived the deadline so no pass starts late
      task: |
        set -euo pipefail
        fail() { echo "goal_iteration: $*" >&2; exit 1; }
        deadline='{{inputs.deadline}}'
        fable='{{inputs.min_claude_fable_remaining}}'
        five='{{inputs.min_claude_5h_remaining}}'
        codex='{{inputs.min_codex_remaining}}'
        poll='{{inputs.usage_poll_seconds}}'
        [[ $deadline =~ ^[0-9]{1,12}$ ]] || fail "deadline must be epoch digits, got '$deadline'"
        for v in "$fable" "$five" "$codex"; do
          [[ $v =~ ^([1-9][0-9]?|100)$ ]] || fail "usage limits must be whole percentages from 1 to 100, got '$v'"
        done
        [[ $poll =~ ^[1-9][0-9]{0,3}$ ]] && [ "$poll" -le 3600 ] || fail "usage_poll_seconds must be a whole number from 1 to 3600, got '$poll'"
        out=$(python3 "{{conduit_dir}}/scripts/usage.py" "$fable" "$five" "$codex")
        if [ "$(date +%s)" -ge "$deadline" ]; then out="${out%$'\n'USAGE_*}"$'\n'ATELIER_DEADLINE; fi
        printf '%s\n' "$out"
      tool: tool:bash
      depends_on: [deadline.output.match(CONTINUE)]
      timeout: 120
  - pause:
      description: Usage outside its limits - wait usage_poll_seconds but never past the deadline, then print ATELIER_DEADLINE if the deadline passed, else USAGE_PAUSED so goal_loop rechecks on its next pass
      task: |
        set -euo pipefail
        fail() { echo "goal_iteration: $*" >&2; exit 1; }
        deadline='{{inputs.deadline}}'
        poll='{{inputs.usage_poll_seconds}}'
        [[ $deadline =~ ^[0-9]{1,12}$ ]] || fail "deadline must be epoch digits, got '$deadline'"
        [[ $poll =~ ^[1-9][0-9]{0,3}$ ]] && [ "$poll" -le 3600 ] || fail "usage_poll_seconds must be a whole number from 1 to 3600, got '$poll'"
        left=$(( deadline - $(date +%s) ))
        if [ "$left" -lt "$poll" ]; then poll=$left; fi
        if [ "$poll" -gt 0 ]; then sleep "$poll"; fi
        if [ "$(date +%s)" -ge "$deadline" ]; then echo ATELIER_DEADLINE; else echo USAGE_PAUSED; fi
      tool: tool:bash
      depends_on: ['usage.output.match((?:^|\n)USAGE_PAUSE\s*\Z)']
      timeout: 3660
  - base:
      description: Require CLAUDE_CODE_DISABLE_BACKGROUND_TASKS=1 and guard the dedicated worktree (same checks as goal_loop setup, so a direct run is refused too), require a clean tree, print the base commit
      task: |
        set -euo pipefail
        fail() { echo "goal_iteration: $*" >&2; exit 1; }
        [ "${CLAUDE_CODE_DISABLE_BACKGROUND_TASKS:-}" = "1" ] \
          || fail "CLAUDE_CODE_DISABLE_BACKGROUND_TASKS must be exactly 1 (got '${CLAUDE_CODE_DISABLE_BACKGROUND_TASKS:-unset}'); run atelier with CLAUDE_CODE_DISABLE_BACKGROUND_TASKS=1 exported - otherwise claude-code backgrounds its tests and ends its turn before they finish (https://code.claude.com/docs/en/env-vars)"
        git rev-parse --is-inside-work-tree >/dev/null 2>&1 || fail "not inside a git worktree"
        [ "$(git rev-parse --show-toplevel)" = "$(pwd -P)" ] || fail "run from the worktree root"
        common=$(cd "$(git rev-parse --git-common-dir)" && pwd -P)
        [ "$(git rev-parse --absolute-git-dir)" != "$common" ] \
          || fail "this is a main checkout or a submodule; use a dedicated linked worktree (git worktree add ../<dir> -b <branch>)"
        git symbolic-ref -q HEAD >/dev/null || fail "detached HEAD; check out a dedicated branch"
        if git ls-files -s | grep '^160000 ' >/dev/null; then fail "submodules are not supported"; fi
        [ -z "$(git ls-files .atelier)" ] || fail "tracked files under .atelier/; untrack them first"
        dirty=$(git status --porcelain | grep -v '^?? \.atelier/' || true)
        [ -z "$dirty" ] || fail "worktree is not clean; review and clean it by hand before rerunning:"$'\n'"$dirty"
        printf '%s' "$(git rev-parse HEAD)"
      tool: tool:bash
      depends_on: ['usage.output.match((?:^|\n)USAGE_READY\s*\Z)']
  - branch:
      description: Print the current branch; only [A-Za-z0-9._/-] names are allowed because the value is interpolated into later shell steps
      task: |
        set -euo pipefail
        branch=$(git symbolic-ref --short -q HEAD) || { echo "goal_iteration: detached HEAD" >&2; exit 1; }
        [[ $branch =~ ^[A-Za-z0-9._/-]+$ ]] || { echo "goal_iteration: branch name '$branch' has characters outside [A-Za-z0-9._/-]; use a plain branch name" >&2; exit 1; }
        printf '%s' "$branch"
      tool: tool:bash
      depends_on: ['usage.output.match((?:^|\n)USAGE_READY\s*\Z)']
  - next_id:
      description: Attach the shared main-checkout history, rebuild its index, and reserve a unique document id
      task: python3 "{{conduit_dir}}/scripts/memory.py" next
      tool: tool:bash
      depends_on: [base, branch]
  - propose:
      description: Codex reads shared decisions and writes one testable idea; no code changes
      task: |
        You are the idea author, not the implementer. Work on branch {{branch.output}}
        at base {{base.output}}. Goal: {{inputs.goal}}

        Read .atelier/implementations/index.md first. This directory points to shared,
        local-only history in the main checkout. Read the relevant prior documents,
        including discarded and unfinished attempts. Verify which kept changes actually
        exist on this branch before deciding what is still needed.
        Do not repeat kept ideas or retry discarded/unfinished ideas without new evidence
        that addresses their recorded failure; explain any justified revisit.

        Study the codebase and its existing design and engineering conventions.
        Pick ONE small idea that Claude Code can implement and verify in one commit.
        Write .atelier/implementations/{{next_id.output}}.md with:
        # Idea (title and a concrete explanation),
        ## Goal, ## Prior decisions (document links and why this is different),
        ## Hypothesis (observable result and exact validation approach),
        ## Files changed (expected scope), and ## Status (PROPOSED).
        The document is already reserved. Replace only its initial placeholder, or finish
        your existing proposal if this is a retry. Do not implement anything, change other
        documents, stage files, commit, reset, switch branches, or push.
        The shared document is the only file you may edit outside this worktree.
        Previous turn: {{loop.previous}}
        End with exactly IDEA: READY only once the proposal is complete.
      tool: harness:codex
      interactive: false
      timeout: 1800
      depends_on: [base, branch, next_id]
      repeat: 2
      until: 'output.match((?:^|\n)IDEA: READY\s*\Z)'
      on_exhaust: fail
  - proposed:
      description: Refuse implementation if the idea author changed git state or omitted the proposal
      task: |
        set -euo pipefail
        [ "$(git rev-parse HEAD)" = "{{base.output}}" ]
        [ "$(git symbolic-ref --short -q HEAD)" = "{{branch.output}}" ]
        [ -z "$(git ls-files .atelier)" ]
        [ -z "$(git status --porcelain | grep -v '^?? \.atelier/' || true)" ]
        doc=".atelier/implementations/{{next_id.output}}.md"
        [ -s "$doc" ]
        grep -q '^## Hypothesis' "$doc"
        grep -q '^## Prior decisions' "$doc"
        python3 "{{conduit_dir}}/scripts/memory.py" index
      tool: tool:bash
      depends_on: [propose, base, branch, next_id]
  - implement:
      description: claude-code implements the Codex proposal, records validation, and commits exactly once; re-prompted with its own output (same idea, same document, same base) until a turn ends with a real COMMIT line, at most three turns
      task: |
        You are working in a git worktree at the current directory, on branch `{{branch.output}}`
        at base commit {{base.output}}. Change code only inside this directory.
        The shared idea document under .atelier/implementations is the only permitted external edit.

        Goal: {{inputs.goal}}

        This prompt is sent up to three times for the same pass. Your reply ends the session:
        anything still running when you reply is killed, and nothing you promise to do later
        happens. Background execution is disabled (CLAUDE_CODE_DISABLE_BACKGROUND_TASKS=1).

        Output of your previous turn in this pass (empty on the first turn):
        {{loop.previous}}

        Resume from the real state of the worktree, not from what the previous turn said. First run
        `git rev-parse HEAD` and `git status --porcelain` and look for
        .atelier/implementations/{{next_id.output}}.md:
        - HEAD is {{base.output}} and the document exists: Codex has proposed this idea.
          Implement that proposal, or continue your implementation if changes already exist.
          Do not pick a different idea, overwrite the proposal, or renumber the document.
        - HEAD is exactly one commit whose parent is {{base.output}}, the tree is clean and the
          document exists: the work is already committed. Do not commit again; reply with that hash.
        - Anything else (another branch, several commits, HEAD moved elsewhere): stop, change
          nothing, describe what you found and reply `COMMIT: none`.

        Procedure:
        1. Read .atelier/implementations/{{next_id.output}}.md, the Codex-authored proposal.
        2. Read .atelier/implementations/index.md and relevant linked prior decisions.
        3. Follow the proposal and the project's existing style. Preserve its Idea, Prior decisions
           and Hypothesis sections. Update Files changed to reflect the actual implementation.
           Append implementation details and checks; if blocked, record the reason and status
           INCOMPLETE and reply COMMIT: none. Do not silently substitute another idea.
        4. Implement the idea and run the relevant existing tests or checks of the project.
        5. Only if the checks pass, commit exactly one non-empty commit on the current branch with a clear
           message. Never stage anything under .atelier/. Never push, merge, rebase, create or switch branches,
           or deploy.
        6. If the idea needs a human decision, or the checks fail and you cannot fix them, write why in the
           document, leave your changes in place for human review and reply `COMMIT: none`. That reply is
           final for this pass and is not retried.

        Tests and checks run in the foreground: start them in a normal tool call and wait for that call to
        return. Never use background execution, `&`, `nohup`, `setsid`, detached processes, subagents, or a
        plan to "wait for the notification"; a turn that ends while a command is running loses that command.
        Record the exact command, its exit status and the final pass/fail counts in the document before
        committing, and quote them in your reply.

        End your final message with exactly one line: `COMMIT: <full 40-character hash>` or `COMMIT: none`.
        Nothing may follow that line. Write it only when the work above is really finished in this turn. If
        a turn ends without it, this prompt comes back with your output attached and you continue the same
        idea; after three turns without it the pass fails and your files are left in place for review.
      tool: harness:claude-code
      interactive: false
      timeout: 3600
      depends_on: [proposed, base, branch, next_id]
      repeat: 3
      until: 'output.match((?:^|\n)COMMIT: (?:[0-9a-f]{40}|none)\s*\Z)'
      on_exhaust: fail
  - verify:
      description: Mechanical check - HEAD is exactly one non-empty commit on top of base, same branch, clean tree, no tracked .atelier, document exists; prints HEAD
      task: |
        set -euo pipefail
        fail() { echo "goal_iteration: $*; work is preserved, review the worktree by hand before rerunning" >&2; exit 1; }
        base='{{base.output}}'
        branch='{{branch.output}}'
        id='{{next_id.output}}'
        [[ $base =~ ^[0-9a-f]{40}$ && $id =~ ^[0-9]+$ && $branch =~ ^[A-Za-z0-9._/-]+$ ]] || fail "bad base/id/branch '$base' '$id' '$branch'"
        doc=".atelier/implementations/$id.md"
        [ "$(git symbolic-ref --short -q HEAD)" = "$branch" ] || fail "branch changed (expected $branch)"
        [ -z "$(git ls-files .atelier)" ] || fail "files under .atelier/ were added to git"
        [ -s "$doc" ] || fail "idea document $doc is missing"
        dirty=$(git status --porcelain | grep -v '^?? \.atelier/' || true)
        [ -z "$dirty" ] || fail "uncommitted changes left behind:"$'\n'"$dirty"
        head=$(git rev-parse HEAD)
        [ "$head" != "$base" ] || fail "no commit was made (see $doc)"
        [ "$(git rev-list --parents -n 1 HEAD)" = "$head $base" ] || fail "HEAD is not exactly one commit on top of $base"
        if git diff --quiet "$base" HEAD; then fail "the commit is empty"; fi
        printf '%s' "$head"
      tool: tool:bash
      depends_on: [implement]
  - judge:
      description: codex independently reviews the commit and appends a Verdict section to the idea document; re-prompted once with its own output if a turn ends without a real VERDICT line
      task: |
        You are reviewing one commit in a git worktree at the current directory, on branch `{{branch.output}}`.
        The commit under review is {{verify.output}}; its parent is {{base.output}}.
        Idea document: .atelier/implementations/{{next_id.output}}.md

        Goal the commit should serve: {{inputs.goal}}

        This prompt is sent up to twice for the same commit. Your reply ends the session: anything still
        running when you reply is killed. Run every test and check in the foreground, in a normal tool call,
        and wait for it to return; never use background execution, `&`, `nohup`, detached processes,
        subagents, or a plan to "wait for the notification".

        Output of your previous turn for this commit (empty on the first turn):
        {{loop.previous}}

        If it is not empty you already started this review: read the document as it is now, do not append
        a second `## Verdict` section (complete or correct the existing one), and finish with the verdict line.

        Procedure:
        1. Read the idea document, then `git show {{verify.output}}`.
        2. Check the hypothesis independently: run the project's relevant tests and the checks the document
           proposes, and read the diff critically. Note each command, its exit status and the final counts.
        3. Do not edit or create tracked files. Do not commit, reset, checkout, push, or change branches.
           The only file you may change is the idea document.
        4. Append a `## Verdict` section to the idea document with your reasoning and the checks you ran,
           ending with the verdict line.

        Your final message must end with exactly one line, either `VERDICT: KEEP` or `VERDICT: DISCARD`.
        KEEP means the commit is correct, tested, and moves the codebase toward the goal. Anything else is DISCARD.
      tool: harness:codex
      interactive: false
      timeout: 1800
      depends_on: [verify]
      repeat: 2
      until: 'output.match((?:^|\n)VERDICT: (?:KEEP|DISCARD)\s*\Z)'
  - judged:
      description: Guard - the judge left HEAD, branch and tracked files untouched and the document still exists
      task: |
        set -euo pipefail
        fail() { echo "goal_iteration: $*; work is preserved, review the worktree by hand before rerunning" >&2; exit 1; }
        head='{{verify.output}}'
        branch='{{branch.output}}'
        id='{{next_id.output}}'
        [[ $head =~ ^[0-9a-f]{40}$ && $id =~ ^[0-9]+$ && $branch =~ ^[A-Za-z0-9._/-]+$ ]] || fail "bad head/id/branch '$head' '$id' '$branch'"
        [ "$(git rev-parse HEAD)" = "$head" ] || fail "the judge moved HEAD"
        [ "$(git symbolic-ref --short -q HEAD)" = "$branch" ] || fail "the judge changed branch"
        [ -z "$(git ls-files .atelier)" ] || fail "files under .atelier/ were added to git"
        dirty=$(git status --porcelain | grep -v '^?? \.atelier/' || true)
        [ -z "$dirty" ] || fail "the judge left uncommitted changes:"$'\n'"$dirty"
        [ -s ".atelier/implementations/$id.md" ] || fail "idea document $id.md is missing"
      tool: tool:bash
      depends_on: [judge]
  - no_verdict:
      description: Fail, preserving all work, when the judge did not end with a valid VERDICT line
      task: |
        echo "goal_iteration: the judge gave no valid final VERDICT line; nothing was kept or discarded, review by hand" >&2
        exit 1
      tool: tool:bash
      depends_on: ['judge.output.not_match((?:^|\n)VERDICT: (?:KEEP|DISCARD)\s*\Z)']
  - keep:
      description: Keep the commit
      task: |
        python3 "{{conduit_dir}}/scripts/memory.py" index
        echo "KEPT {{next_id.output}}"
      tool: tool:bash
      depends_on: [judged, 'judge.output.match((?:^|\n)VERDICT: KEEP\s*\Z)']
  - discard:
      description: Discard - reset this dedicated worktree to base and remove untracked files, keeping everything under .atelier/
      task: |
        set -euo pipefail
        base='{{base.output}}'
        [[ $base =~ ^[0-9a-f]{40}$ ]] || { echo "goal_iteration: bad base '$base'" >&2; exit 1; }
        git reset -q --hard "$base"
        git clean -fdq -e /.atelier/
        python3 "{{conduit_dir}}/scripts/memory.py" index
        echo "DISCARDED {{next_id.output}}"
      tool: tool:bash
      depends_on: [judged, 'judge.output.match((?:^|\n)VERDICT: DISCARD\s*\Z)']
